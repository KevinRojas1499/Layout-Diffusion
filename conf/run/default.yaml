# Default run config - override from CLI: run.batch_size=64 run.num_iters=10000
# Package is "run" by default for config groups, so this merges into cfg.run
defaults:
  - base_run

seed: 42
batch_size: 128
num_iters: 5000
log_rate: 500
warmup_iters: 100
num_workers: 2
dir: outputs/layout
load_checkpoint: null
enable_wandb: false
run_name: ""
ema_beta: 0.9999
