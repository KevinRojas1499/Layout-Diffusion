defaults:
  - _self_
  - dataset: null
  - model: LayoutFlow

# e.g. `dataset=RICO dataset_name=RICO` -- kept as an explicit string (rather than
# upstream's parse-it-out-of-expname trick) so it's obvious this only controls
# which pretrained FID net + reference stats get loaded.
dataset_name: ???
expname: ${dataset_name}_bs${dataset.batch_size}
run_dir: ???        # e.g. $LAB/runs/layoutflow-minimal/<run-name> -- keep off home (13GB quota)
wandb_dir: ${run_dir}/wandb
ckpt_path: null
ema_decay: 0               # EMA of the backbone weights (src/ema.py): validation + checkpoints use it; 0 = off
ckpt_every_n_epochs: 0     # > 0 additionally keeps a checkpoint every n epochs (plus last.ckpt is always written)
ckpt_monitor: FID_Layout   # validation metric that selects the top-3 checkpoints (val_loss / count_mae for datasets without a FID net)
enable_wandb: true
visualize: false

data:
  max_len: 20
  format: xywh

trainer:
  _target_: lightning.pytorch.Trainer
  max_epochs: 1000
  check_val_every_n_epoch: 10
  accelerator: gpu
  devices: auto
  num_sanity_val_steps: 2

hydra:
  output_subdir: null
  run:
    dir: .
