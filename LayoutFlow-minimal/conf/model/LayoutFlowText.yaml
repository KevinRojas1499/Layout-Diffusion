# @package _global_
# Layout + text: per-element clocks (insertion=oneflow) with a FlexMDM text factor (Dream-Coder-7B, LoRA) on every
# text element, coupled both ways each step. See src/models/layout_flow_text.py and src/text_factor.py.
model:
  _target_: src.models.layout_flow_text.LayoutFlowText
  text_factor:
    _target_: src.text_factor.TextFactor
    ckpt: yuyuanchen0/flexmdm
    d_layout: 512
    n_prefix: 4
    max_tokens: 24
    lora_r: 16
    lora_alpha: 32
    temperature: 0.1          # FlexMDM's unmasking temperature (their published setting)
    insertion_temperature: 1.0
  text_id: 2                  # Crello: TextElement
  text_loss_weight: 1.0
  text_chunk: 512             # text sequences per LM forward
  init_layout_ckpt: null      # layout-only checkpoint to start the layout backbone from
  init_ckpt: null             # previous layout + text checkpoint to continue from
  text_mode: joint            # joint (the model) | caption (layout-then-caption baseline: same LM, text after the layout, no coupling)
  text_grad_to_layout: false  # true lets the text loss train the layout backbone through the prompt (degrades the boxes)
  prompt_encoder: true        # the text factor reads the layout through its own 2-layer encoder (trained by the text loss only)
  text_lr: 1e-4               # learning rate of the LM's LoRA and insertion head
  text_lag: 0.0               # >0: the text clock trails the box clock by this much (u_text = (u - a)/(1 - a)); 0 = concurrent
  optimizer:
    _partial_: true
    _target_: torch.optim.AdamW
    lr: 0.0005
  scheduler: reduce_on_plateau
  backbone_model:
    _target_: src.backbone_varlen.VarLenBackbone
    latent_dim: 128
    d_model: 512
    nhead: 8
    dim_feedforward: 2048
    num_layers: 4
    dropout: 0.1
    num_cat: ${dataset.dataset.num_cat}
    gmm_components: 16
    sigma_min: 0.01
    elem_rates: true
    cond_input: false       # true with cond=random4: feed the given/held mask to the network (needed by the insertion model)
    ctx_dim: 0              # content-aware: canvas feature dim (385 for scripts/precompute_canvas_feats.py), 0 = none
    geo_bias: false         # LayoutGD-style pairwise geometric attention bias (a GAT with edge features)
    ret_k: 0                # retrieval augmentation (RALF): number of retrieved training layouts joining the context (dataset.dataset.retrieval_k)
    sal_token: false        # saliency bounding box token (LayoutDiT / LayoutGD; dataset.dataset.salbox=true)
    ctx_mode: prepend       # content-aware: prepend canvas tokens to the set | cross: cross-attention to them
  sampler:
    _target_: src.sampler.GaussianSampler
    out_dim: 4
  pretrained_dir: ???
  fid_calc_every_n: ${trainer.check_val_every_n_epoch}
  num_cat: ${dataset.dataset.num_cat}
  inference_steps: 100
  insertion: oneflow
  clock: coupled          # coupled: s_i = (t - tau_i) / (1 - tau_i) | decoupled: s_i ~ U(0,1) independent of t (any sampling clock policy is then on-distribution)
  t_max: 0.5              # reveal schedule kappa(t) = min(t / t_max, 1); 1.0 is much worse (see README)
  unmask_geom: gmm        # gmm: sample the clean box from the mixture | mean: point estimate
  add_loss: geom_l1_loss
  add_loss_weight: 0.2
  cat_loss_weight: 0.25
  geom_unmask_weight: 0.05
  ins_loss_weight: 0.1
  cond: uncond            # random4: LayoutFlow's training mix (uncond / elem_compl / cat_cond / size_cond by batch quarter); random5 adds a refinement fifth (t in [0.9,1])
  ralf_cache: null        # content-aware datasets: RALF cache dir -> validation FID with their FIDNetV3 (src/fid_ralf.py)
  fid_empty_id: null      # padding baseline: category id to drop before the FID
  cat_drop: 0.0           # > 0 trains the category-unconditional velocity too (for +sampling.cfg_w at test time)
  ctx_token_drop: 0.0     # content-aware: hide this fraction of canvas tokens per sample during training
  ctx_drop: 0.0           # content-aware: hide the whole canvas for this fraction of samples during training
  ret_drop: 0.0           # retrieval: hide the whole retrieved set for this fraction of samples during training
  relation_loss_weight: 0.0   # content-aware: hinge on strict (underlay contains text) for the data's pairs, on the predicted clean boxes
  relation_text_id: 2
  relation_underlay_id: 3
  relation_margin: 0.01       # canvas units
