# @package _global_
# OneFlow-style variable-length baseline (Nguyen et al. 2025): Edit-Flow insertion of the discrete part (class,
# per-element rates) while each box is flow-matched on its own clock from pure noise at its insertion time.
# Same backbone, schedule and losses otherwise. See LayoutFlowVarLen.editflow_* in src/models/layout_flow_varlen.py.
model:
  _target_: src.models.layout_flow_varlen.LayoutFlowVarLen
  optimizer:
    _partial_: true
    _target_: torch.optim.AdamW
    lr: 0.0005
  scheduler: reduce_on_plateau
  backbone_model:
    _target_: src.backbone_varlen.VarLenBackbone
    latent_dim: 128
    d_model: 512
    nhead: 8
    dim_feedforward: 2048
    num_layers: 4
    dropout: 0.1
    num_cat: ${dataset.dataset.num_cat}
    gmm_components: 16
    sigma_min: 0.01
    elem_rates: true
    cond_input: false       # true with cond=random4: feed the given/held mask to the network (needed by the insertion model)
    ctx_dim: 0              # content-aware: canvas feature dim (385 for scripts/precompute_canvas_feats.py), 0 = none
    geo_bias: false         # LayoutGD-style pairwise geometric attention bias (a GAT with edge features)
    ctx_mode: prepend       # content-aware: prepend canvas tokens to the set | cross: cross-attention to them
  sampler:
    _target_: src.sampler.GaussianSampler
    out_dim: 4
  pretrained_dir: ???
  fid_calc_every_n: ${trainer.check_val_every_n_epoch}
  num_cat: ${dataset.dataset.num_cat}
  inference_steps: 100
  insertion: oneflow
  clock: coupled          # coupled: s_i = (t - tau_i) / (1 - tau_i) | decoupled: s_i ~ U(0,1) independent of t (any sampling clock policy is then on-distribution)
  t_max: 0.5              # reveal schedule kappa(t) = min(t / t_max, 1); 1.0 is much worse (see README)
  unmask_geom: gmm        # gmm: sample the clean box from the mixture | mean: point estimate
  add_loss: geom_l1_loss
  add_loss_weight: 0.2
  cat_loss_weight: 0.25
  geom_unmask_weight: 0.05
  ins_loss_weight: 0.1
  cond: uncond            # random4: LayoutFlow's training mix (uncond / elem_compl / cat_cond / size_cond by batch quarter); random5 adds a refinement fifth (t in [0.9,1])
  ralf_cache: null        # content-aware datasets: RALF cache dir -> validation FID with their FIDNetV3 (src/fid_ralf.py)
  fid_empty_id: null      # padding baseline: category id to drop before the FID
  cat_drop: 0.0           # > 0 trains the category-unconditional velocity too (for +sampling.cfg_w at test time)
  ctx_token_drop: 0.0     # content-aware: hide this fraction of canvas tokens per sample during training
  ctx_drop: 0.0           # content-aware: hide the whole canvas for this fraction of samples during training
