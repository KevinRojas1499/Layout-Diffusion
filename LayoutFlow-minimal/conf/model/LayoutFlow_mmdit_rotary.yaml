# @package _global_
# Identical to LayoutFlow_mmdit.yaml except backbone_model.pos_encoding=rotary
# instead of the additive shared position embedding -- tests QM9's actual
# cross-modality binding mechanism (matching rotary phase applied to both
# streams' q/k at the same index) against the simpler additive embedding.
model:
  _target_: src.models.layout_flow.LayoutFlow
  optimizer:
    _partial_: true
    _target_: torch.optim.AdamW
    lr: 0.0005
  scheduler: reduce_on_plateau
  backbone_model:
    _target_: src.backbone_mmdit.MMDiTBackbone
    dim_modalities: [256, 256]
    dim_joint_attn: 256
    depth: 4
    dim_head: 64
    heads: 8
    num_cat: ${dataset.dataset.num_cat}
    max_len: ${data.max_len}
    pos_encoding: rotary
  sampler:
    _target_: src.sampler.GaussianSampler
    out_dim: 7   # see LayoutFlow.yaml's comment -- pass model.sampler.out_dim=9 for RICO
  pretrained_dir: ???
  sigma: 0.0
  fid_calc_every_n: ${trainer.check_val_every_n_epoch}
  num_cat: ${dataset.dataset.num_cat}
  time_sampling: uniform
  inference_steps: 100
  cond: random4
  train_traj: linear
  ode_solver: euler
  add_loss: geom_l1_loss
  add_loss_weight: 0.2
