# @package _global_
# Alternative to LayoutFlow_mmdit.yaml: additive shared position embedding
# instead of rotary. Kept for reference -- in a head-to-head RICO run this
# converged more slowly and to a slightly higher loss than rotary long-term,
# though its FID curve was noticeably less noisy early in training. Worth
# revisiting if rotary's frequency schedule (tuned for much longer sequences
# than our ~20-element layouts) turns out to need retuning.
model:
  _target_: src.models.layout_flow.LayoutFlow
  optimizer:
    _partial_: true
    _target_: torch.optim.AdamW
    lr: 0.0005
  scheduler: reduce_on_plateau
  backbone_model:
    _target_: src.backbone_mmdit.MMDiTBackbone
    dim_modalities: [256, 256]
    dim_joint_attn: 256
    depth: 4
    dim_head: 64
    heads: 8
    num_cat: ${dataset.dataset.num_cat}
    max_len: ${data.max_len}
    pos_encoding: additive
  sampler:
    _target_: src.sampler.GaussianSampler
    out_dim: 7   # see LayoutFlow.yaml's comment -- pass model.sampler.out_dim=9 for RICO
  pretrained_dir: ???
  sigma: 0.0
  fid_calc_every_n: ${trainer.check_val_every_n_epoch}
  num_cat: ${dataset.dataset.num_cat}
  time_sampling: uniform
  inference_steps: 100
  cond: random4
  train_traj: linear
  ode_solver: euler
  add_loss: geom_l1_loss
  add_loss_weight: 0.2
